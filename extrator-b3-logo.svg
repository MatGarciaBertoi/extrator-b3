<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#1a1040"/>
      <stop offset="55%"  stop-color="#1e2d6e"/>
      <stop offset="100%" stop-color="#0c2254"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0.5" x2="1" y2="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="lines" x1="0" y1="0.5" x2="1" y2="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#6366f1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="200" height="200" rx="44" fill="url(#bg)"/>

  <!-- Top ambient glow -->
  <ellipse cx="100" cy="18" rx="85" ry="22" fill="#6366f1" opacity="0.14"/>

  <!-- Subtle inner border -->
  <rect x="1" y="1" width="198" height="198" rx="43" fill="none" stroke="#4f46e5" stroke-width="1.5" opacity="0.25"/>

  <!-- ── Three ascending bars (left zone) ── -->
  <!-- Bar 1 (lowest) -->
  <rect x="22" y="120" width="24" height="46" rx="6" fill="url(#bar1)"/>
  <!-- Bar 2 (mid) -->
  <rect x="56" y="96" width="24" height="70" rx="6" fill="url(#bar2)"/>
  <!-- Bar 3 (tallest) -->
  <rect x="90" y="64" width="24" height="102" rx="6" fill="url(#bar3)" filter="url(#softglow)"/>

  <!-- Subtle cap dots on top of bars -->
  <circle cx="34" cy="118" r="4" fill="#818cf8" opacity="0.7"/>
  <circle cx="68" cy="94"  r="4" fill="#a5b4fc" opacity="0.75"/>
  <circle cx="102" cy="62" r="4" fill="#e0e7ff" opacity="0.9"/>

  <!-- ── Chevron arrow (center-right) ── -->
  <path d="M136 76 L166 100 L136 124"
        fill="none"
        stroke="url(#arrow)"
        stroke-width="11"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- ── Spreadsheet lines (bottom-right, output signal) ── -->
  <line x1="137" y1="142" x2="178" y2="142" stroke="url(#lines)" stroke-width="3"   stroke-linecap="round"/>
  <line x1="137" y1="153" x2="171" y2="153" stroke="url(#lines)" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
  <line x1="137" y1="163" x2="175" y2="163" stroke="url(#lines)" stroke-width="2"   stroke-linecap="round" opacity="0.4"/>
</svg>
